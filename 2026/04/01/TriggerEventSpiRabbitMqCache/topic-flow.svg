<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="820" height="520" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Topic 命名規則 與 Cache Key 對應關係</text>

  <!-- ── Topic Pattern Box ── -->
  <rect x="30" y="60" width="360" height="160" rx="10" fill="#3498db" opacity="0.1" stroke="#3498db" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">Topic 格式（RabbitMQ routing key）</text>
  <rect x="60" y="95" width="300" height="42" rx="8" fill="#2980b9"/>
  <text x="210" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="white">{EventType}.Account.{accountId}</text>

  <text x="60" y="160" font-size="12" fill="#555">範例：</text>
  <rect x="60" y="167" width="300" height="22" rx="4" fill="#d6eaf8" stroke="#aed6f1"/>
  <text x="75" y="183" font-size="11" fill="#2471a3">DPTransStatus.Account.12345</text>
  <rect x="60" y="193" width="300" height="22" rx="4" fill="#d6eaf8" stroke="#aed6f1"/>
  <text x="75" y="209" font-size="11" fill="#2471a3">WDTransStatus.Account.99887</text>

  <!-- Arrow -->
  <line x1="390" y1="140" x2="440" y2="140" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="415" y="132" text-anchor="middle" font-size="10" fill="#888">Rule</text>
  <text x="415" y="145" text-anchor="middle" font-size="10" fill="#888">Match</text>

  <!-- ── ConsumerRule Box ── -->
  <rect x="440" y="60" width="350" height="190" rx="10" fill="#e74c3c" opacity="0.1" stroke="#e74c3c" stroke-width="2"/>
  <text x="615" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">ConsumerRuleBinding (AppSettings.config)</text>

  <!-- Rule rows -->
  <rect x="455" y="95" width="320" height="26" rx="4" fill="#fadbd8" stroke="#f1948a"/>
  <text x="465" y="113" font-size="10" fill="#922b21">TopicFilter: "DPTransStatus.Account.*"</text>
  <rect x="455" y="125" width="320" height="26" rx="4" fill="#fdebd0" stroke="#f0b27a"/>
  <text x="465" y="143" font-size="10" fill="#784212">Action: ExpireRedisKey</text>
  <rect x="455" y="155" width="320" height="26" rx="4" fill="#d5f5e3" stroke="#82e0aa"/>
  <text x="465" y="173" font-size="10" fill="#1e8449">KeyPatten: "PendingTransaction:{0}:CacheState"</text>

  <text x="455" y="208" font-size="11" fill="#7f8c8d">→ {0} 由 TopicMessage.Data["key"] (account id) 填入</text>
  <text x="455" y="225" font-size="11" fill="#7f8c8d">→ ExpiryTime 留空 = 立即失效 (TTL=0)</text>

  <!-- Arrow down to Redis Key -->
  <line x1="210" y1="220" x2="210" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="615" y1="250" x2="615" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="210" y1="280" x2="615" y2="280" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="412" y="274" text-anchor="middle" font-size="10" fill="#888">產生對應的 Redis Key</text>

  <!-- ── Redis Key Pattern Box ── -->
  <rect x="100" y="290" width="620" height="180" rx="10" fill="#f39c12" opacity="0.1" stroke="#e67e22" stroke-width="2"/>
  <text x="410" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#d35400">Redis Cache Key 格式</text>
  <rect x="200" y="322" width="420" height="42" rx="8" fill="#d35400"/>
  <text x="410" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="white">{CacheName}:{accountId}:CacheState</text>

  <text x="120" y="390" font-size="12" fill="#555">CacheState key 範例（對應不同 EventType Topic）：</text>

  <!-- Key examples in 2 cols -->
  <rect x="120" y="398" width="280" height="22" rx="4" fill="#fef9e7" stroke="#f9e79f"/>
  <text x="130" y="414" font-size="11" fill="#7d6608">PendingTransaction:12345:CacheState</text>
  <rect x="420" y="398" width="280" height="22" rx="4" fill="#fef9e7" stroke="#f9e79f"/>
  <text x="430" y="414" font-size="11" fill="#7d6608">WithdrawalTransactions:12345:CacheState</text>
  <rect x="120" y="424" width="280" height="22" rx="4" fill="#fef9e7" stroke="#f9e79f"/>
  <text x="130" y="440" font-size="11" fill="#7d6608">DepositTransactions:12345:CacheState</text>
  <rect x="420" y="424" width="280" height="22" rx="4" fill="#fef9e7" stroke="#f9e79f"/>
  <text x="430" y="440" font-size="11" fill="#7d6608">MemberStatus:12345:CacheState</text>
  <rect x="120" y="450" width="280" height="22" rx="4" fill="#fef9e7" stroke="#f9e79f"/>
  <text x="130" y="466" font-size="11" fill="#7d6608">MemberPromotions:12345:CacheState</text>
  <rect x="420" y="450" width="280" height="22" rx="4" fill="#fef9e7" stroke="#f9e79f"/>
  <text x="430" y="466" font-size="11" fill="#7d6608">Star4KYCVerification:12345:CacheState</text>

  <!-- Note at bottom -->
  <text x="410" y="505" text-anchor="middle" font-size="11" fill="#888">CacheState key 失效後，下次讀取會 re-fetch 最新資料並重建 Cache</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>

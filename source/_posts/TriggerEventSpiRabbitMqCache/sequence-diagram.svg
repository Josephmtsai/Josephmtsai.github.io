<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="860" height="600" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Cache 清除序列圖（Sequence Diagram）</text>

  <!-- ── Lifeline headers ── -->
  <!-- Caller -->
  <rect x="30" y="50" width="120" height="44" rx="8" fill="#3498db" opacity="0.85"/>
  <text x="90" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Caller</text>
  <text x="90" y="86" text-anchor="middle" font-size="10" fill="#d6eaf8">資料修改端</text>
  <!-- EventSPI -->
  <rect x="215" y="50" width="130" height="44" rx="8" fill="#27ae60" opacity="0.85"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="white">EventSPI</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#d5f5e3">MessageCentral</text>
  <!-- RabbitMQ -->
  <rect x="415" y="50" width="130" height="44" rx="8" fill="#e74c3c" opacity="0.85"/>
  <text x="480" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="white">RabbitMQ</text>
  <text x="480" y="86" text-anchor="middle" font-size="10" fill="#fadbd8">Topic Exchange</text>
  <!-- Consumer -->
  <rect x="610" y="50" width="130" height="44" rx="8" fill="#8e44ad" opacity="0.85"/>
  <text x="675" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Consumer</text>
  <text x="675" y="86" text-anchor="middle" font-size="10" fill="#e8daef">AccountListener</text>
  <!-- Redis -->
  <rect x="755" y="50" width="80" height="44" rx="8" fill="#e67e22" opacity="0.85"/>
  <text x="795" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Redis</text>
  <text x="795" y="86" text-anchor="middle" font-size="10" fill="#fdebd0">AccountCache</text>

  <!-- Lifelines (dashed vertical lines) -->
  <line x1="90" y1="94" x2="90" y2="575" stroke="#3498db" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="280" y1="94" x2="280" y2="575" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="480" y1="94" x2="480" y2="575" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="675" y1="94" x2="675" y2="575" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="795" y1="94" x2="795" y2="575" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- ──── Step 1 ──── -->
  <text x="20" y="132" font-size="11" font-weight="bold" fill="#7f8c8d">①</text>
  <line x1="90" y1="128" x2="270" y2="128" stroke="#2980b9" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="100" y="112" width="165" height="14" fill="#f8f9fa"/>
  <text x="183" y="123" text-anchor="middle" font-size="10.5" fill="#2471a3">POST /api/messagecental</text>
  <rect x="100" y="128" width="165" height="14" fill="#f8f9fa"/>
  <text x="183" y="140" text-anchor="middle" font-size="10" fill="#555">{ Topic, Action, Data: {key: accountId} }</text>

  <!-- ──── Step 2 ──── -->
  <text x="20" y="178" font-size="11" font-weight="bold" fill="#7f8c8d">②</text>
  <line x1="280" y1="172" x2="466" y2="172" stroke="#1e8449" stroke-width="2" marker-end="url(#greenArrow)"/>
  <rect x="285" y="155" width="180" height="14" fill="#f8f9fa"/>
  <text x="373" y="166" text-anchor="middle" font-size="10.5" fill="#1e8449">MQService.EmitMessage()</text>
  <rect x="285" y="172" width="180" height="14" fill="#f8f9fa"/>
  <text x="373" y="184" text-anchor="middle" font-size="10" fill="#555">Publish to topic exchange</text>

  <!-- ──── Step 3 ──── -->
  <text x="20" y="222" font-size="11" font-weight="bold" fill="#7f8c8d">③</text>
  <line x1="480" y1="216" x2="662" y2="216" stroke="#c0392b" stroke-width="2" marker-end="url(#redArrow)"/>
  <rect x="488" y="200" width="170" height="14" fill="#f8f9fa"/>
  <text x="572" y="211" text-anchor="middle" font-size="10.5" fill="#c0392b">Deliver message to queue</text>
  <rect x="488" y="216" width="170" height="14" fill="#f8f9fa"/>
  <text x="572" y="228" text-anchor="middle" font-size="10" fill="#555">BindingKey: *.Account.*  matched</text>

  <!-- ──── Step 4 ──── -->
  <text x="20" y="268" font-size="11" font-weight="bold" fill="#7f8c8d">④</text>
  <!-- self loop for RuleFilterTrigger -->
  <path d="M675 262 Q730 262 730 278 Q730 294 675 294" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#purpleArrow)"/>
  <text x="735" y="272" font-size="10" fill="#8e44ad">RuleFilterTrigger()</text>
  <text x="735" y="287" font-size="10" fill="#555">Regex match TopicFilter</text>

  <!-- ──── Step 5 ──── -->
  <text x="20" y="330" font-size="11" font-weight="bold" fill="#7f8c8d">⑤</text>
  <!-- RedLock acquire -->
  <path d="M675 324 Q730 324 730 340 Q730 356 675 356" stroke="#8e44ad" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#purpleArrow)"/>
  <text x="735" y="334" font-size="10" fill="#8e44ad">RedLockFactory</text>
  <text x="735" y="349" font-size="10" fill="#555">.CreateLockAsync(key, 3s)</text>
  <text x="735" y="364" font-size="10" fill="#27ae60">→ Lock Acquired ✓</text>

  <!-- ──── Step 6 ──── -->
  <text x="20" y="400" font-size="11" font-weight="bold" fill="#7f8c8d">⑥</text>
  <line x1="675" y1="393" x2="806" y2="393" stroke="#8e44ad" stroke-width="2" marker-end="url(#orangeArrow)"/>
  <rect x="680" y="376" width="125" height="14" fill="#f8f9fa"/>
  <text x="742" y="388" text-anchor="middle" font-size="10.5" fill="#8e44ad">RedisService.ExpireKey()</text>
  <rect x="680" y="393" width="125" height="14" fill="#f8f9fa"/>
  <text x="742" y="405" text-anchor="middle" font-size="10" fill="#555">key: {CacheName}:{id}:CacheState</text>

  <!-- ──── Step 7 ──── -->
  <text x="20" y="440" font-size="11" font-weight="bold" fill="#7f8c8d">⑦</text>
  <!-- self loop for KeyExpire -->
  <path d="M795 433 Q840 433 840 449 Q840 465 795 465" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#orangeArrow)"/>
  <text x="845" y="442" font-size="10" fill="#e67e22">db.KeyExpire</text>
  <text x="845" y="457" font-size="10" fill="#555">(key, TTL=0)</text>
  <text x="845" y="472" font-size="10" fill="#c0392b">Cache 立即失效</text>

  <!-- ──── Step 8 return ──── -->
  <text x="20" y="508" font-size="11" font-weight="bold" fill="#7f8c8d">⑧</text>
  <line x1="795" y1="502" x2="686" y2="502" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#purpleArrow)"/>
  <text x="742" y="496" text-anchor="middle" font-size="10" fill="#888">return true (key existed)</text>

  <!-- ──── Step 9 log ──── -->
  <text x="20" y="548" font-size="11" font-weight="bold" fill="#7f8c8d">⑨</text>
  <path d="M675 542 Q730 542 730 558 Q730 574 675 574" stroke="#8e44ad" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#purpleArrow)"/>
  <text x="735" y="552" font-size="10" fill="#8e44ad">log.Messages()</text>
  <text x="735" y="567" font-size="10" fill="#555">"Expire Key {key}"</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="blueArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#2980b9"/>
    </marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#1e8449"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#c0392b"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#8e44ad"/>
    </marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#e67e22"/>
    </marker>
  </defs>
</svg>
